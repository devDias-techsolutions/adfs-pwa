<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AD Fonte da Salvação</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050B10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AD Fonte">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050B10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 32px 24px;
      gap: 0;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 24px;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.08);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .sub {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.45;
      margin-bottom: 48px;
    }

    /* Caixa de instalação */
    .install-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 24px;
      display: none; /* aparece só se o banner PWA estiver disponível */
    }
    .install-box.visible { display: block; }
    .install-box p {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .btn-install {
      width: 100%;
      padding: 14px;
      background: #009A93;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    .btn-install:active { opacity: 0.85; }

    /* Instrução manual */
    .manual-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 32px;
    }
    .manual-box .label {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.4;
      margin-bottom: 14px;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      opacity: 0.75;
      line-height: 1.4;
    }
    .step:last-child { margin-bottom: 0; }
    .step-num {
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,154,147,0.3);
      color: #00c9c0;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    /* Botão acessar */
    .btn-acessar {
      width: 100%;
      max-width: 340px;
      padding: 16px;
      background: transparent;
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all .2s;
    }
    .btn-acessar:hover, .btn-acessar:active {
      background: rgba(255,255,255,0.05);
      color: #fff;
    }

    /* Contador */
    .counter {
      font-size: 12px;
      opacity: 0.3;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <img src="icon-192.png" alt="Logo" class="logo">
  <h1>AD Fonte da Salvação</h1>
  <p class="sub">Plataforma de Gestão Ministerial</p>

  <!-- Botão automático de instalação PWA (aparece só quando disponível) -->
  <div class="install-box" id="installBox">
    <p>Instale o app na sua tela inicial com o ícone da igreja.</p>
    <button class="btn-install" id="btnInstall">⬇ Instalar aplicativo</button>
  </div>

  <!-- Instruções manuais -->
  <div class="manual-box">
    <div class="label">Como salvar na tela inicial</div>
    <div class="step">
      <div class="step-num">1</div>
      <span>Toque nos <strong>3 pontinhos</strong> (⋮) no canto superior do Chrome</span>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <span>Toque em <strong>"Adicionar à tela inicial"</strong></span>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <span>Confirme tocando em <strong>"Adicionar"</strong></span>
    </div>
  </div>

  <button class="btn-acessar" id="btnAcessar">
    Acessar o sistema →
  </button>
  <div class="counter" id="counter">Redirecionando em 15s…</div>

  <script>
    var GAS_URL = "https://script.google.com/macros/s/AKfycbwPcyAE55Pgu2P_4lN068mJN2siMocYY7LWhW85hsdO8odPbuKazRt0dH1lpnKxv4U1nw/exec";
    var deferredPrompt = null;
    var seconds = 15;

    // Captura o evento de instalação PWA
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBox').classList.add('visible');
    });

    // Botão instalar
    document.getElementById('btnInstall').addEventListener('click', function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(result) {
          if (result.outcome === 'accepted') {
            window.location.href = GAS_URL;
          }
          deferredPrompt = null;
        });
      }
    });

    // Botão acessar imediatamente
    document.getElementById('btnAcessar').addEventListener('click', function() {
      window.location.href = GAS_URL;
    });

    // Contador regressivo
    var counterEl = document.getElementById('counter');
    var timer = setInterval(function() {
      seconds--;
      if (seconds <= 0) {
        clearInterval(timer);
        counterEl.textContent = 'Redirecionando…';
        window.location.href = GAS_URL;
      } else {
        counterEl.textContent = 'Redirecionando em ' + seconds + 's…';
      }
    }, 1000);

    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
